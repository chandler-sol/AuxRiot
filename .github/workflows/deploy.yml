name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 0bf986208f219b3ecd65ab7f23e49d8e
    steps:
      - name: Check for Cloudflare token
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN secret is not set yet; skipping deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.token.outputs.ok == 'true'
        run: npm ci

      - name: Type-check
        if: steps.token.outputs.ok == 'true'
        run: npm run check

      - name: Build
        if: steps.token.outputs.ok == 'true'
        run: npm run build

      - name: Apply database migrations
        if: steps.token.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply auxriot --remote

      - name: Deploy
        if: steps.token.outputs.ok == 'true'
        run: npx wrangler deploy
