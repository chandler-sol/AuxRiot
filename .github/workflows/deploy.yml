name: Deploy to Cloudflare

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # The test robot (tests/e2e): runs the whole site locally and clicks through it.
  # A failure stops the deploy below and GitHub emails you.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Type-check
        run: npm run check
      - name: Build
        run: npm run build
      - name: Local settings for the test server
        # Test-only values; the real secrets live in Cloudflare.
        run: |
          printf 'BETA_PASSWORD=local-test-pw\nSTRIPE_WEBHOOK_SECRET=whsec_localtest123\nSTRIPE_SECRET_KEY=sk_test_robot_not_real\n' > .dev.vars.beta
      - name: Local database
        run: npx wrangler d1 migrations apply auxriot-beta --local --env beta
      - name: Browser
        run: npx playwright install --with-deps chromium
      - name: Run the robot
        run: npx playwright test
      - name: Save screenshots and report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: robot-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 0bf986208f219b3ecd65ab7f23e49d8e
      # main → auxriot.com; beta → beta.auxriot.com (separate database, bucket and secrets)
      DB_NAME: ${{ github.ref_name == 'beta' && 'auxriot-beta' || 'auxriot' }}
      ENV_FLAG: ${{ github.ref_name == 'beta' && '--env beta' || '' }}
    steps:
      - name: Check for Cloudflare token
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN secret is not set yet; skipping deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.token.outputs.ok == 'true'
        run: npm ci

      - name: Type-check
        if: steps.token.outputs.ok == 'true'
        run: npm run check

      - name: Build
        if: steps.token.outputs.ok == 'true'
        run: npm run build

      - name: Apply database migrations
        if: steps.token.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply $DB_NAME --remote $ENV_FLAG

      - name: Deploy
        if: steps.token.outputs.ok == 'true'
        run: npx wrangler deploy $ENV_FLAG
